# ConnectServers site configuration
#
# Format:
# site_id|dns_suffixes|smb_probe_host|semicolon-separated_smb_urls
#
# - site_id:       A short, unique name containing letters, numbers, ., _, or -.
# - dns_suffixes:  One or more comma-separated DNS search suffixes. Use * only
#                  when SMB reachability alone is sufficiently specific.
# - probe host:    A host that accepts SMB connections on TCP port 445.
# - SMB URLs:      One or more smb:// URLs separated by semicolons.
#                  {user} is replaced with the current macOS username or the
#                  value supplied with --user.
#
# The atl record preserves the intent and server paths from the original
# script. Replace * with the organization's actual DNS suffix when possible.
atl|*|atlfs01|smb://{user}@atlfs01/users/{user};smb://{user}@atlfs01/shared

# Additional example:
# denver|denver.example.com,corp.example.com|denfs01|smb://{user}@denfs01/users/{user};smb://{user}@denfs01/shared
